apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Only the Kubernetes objects. The *-values.yaml files in this directory are
# Helm values consumed by the Applications in argocd/applications/ and are
# deliberately not listed here — they are inputs to a chart, not manifests.
resources:
  - rules/webapp-slo.yaml
  - dashboards/webapp-dashboard.yaml
