# The canary dial.
#
# Changing the weights below, committing, and letting ArgoCD apply it is the
# entire release mechanism. No kubectl, no helm upgrade, no console.

apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: api
  namespace: webapp-prod
spec:
  host: api.webapp-prod.svc.cluster.local
  # Subsets are defined by POD LABELS, which is why the Helm chart sets
  # `version` on the pod template. Remove that label and both subsets match
  # nothing — Istio reports no error and all traffic simply fails.
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
  trafficPolicy:
    outlierDetection:
      # Eject a backend that returns 5 consecutive 5xx. This is the mesh doing
      # for pods what the ALB health check did for instances in the HA project.
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api
  namespace: webapp-prod
spec:
  hosts:
    - api.webapp-prod.svc.cluster.local
  http:
    # Rule order matters — first match wins. The header rule MUST come first,
    # or the catch-all weighted route below swallows every request and the
    # header is never evaluated.
    - name: canary-by-header
      match:
        - headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: api.webapp-prod.svc.cluster.local
            subset: v2

    # Everyone else: the weighted split. 90/10 → 50/50 → 0/100 by git commit.
    - name: weighted-split
      route:
        - destination:
            host: api.webapp-prod.svc.cluster.local
            subset: v1
          weight: 90
        - destination:
            host: api.webapp-prod.svc.cluster.local
            subset: v2
          weight: 10
      retries:
        attempts: 2
        perTryTimeout: 2s
        retryOn: 5xx,reset,connect-failure
