apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
    app.kubernetes.io/part-of: webapp
spec:
  # NOTE: no `version` in the selector. This Service deliberately spans every
  # version of api, which is what allows Istio to split traffic between the v1
  # and v2 subsets behind one stable DNS name.
  selector:
    app: api
  ports:
    # The port name MUST begin with "http". Istio infers the protocol from it —
    # a port named "web", or left unnamed, is treated as opaque TCP, and L7
    # routing rules silently do not apply. This catches everyone once.
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    # ------------------------------------------------------------------------
    # The metrics port, and the only way to scrape this app under STRICT mTLS.
    #
    # 15020 is the Istio sidecar's telemetry port, serving the application's
    # own metrics merged with Envoy's, and Istio keeps it outside mTLS so that
    # monitoring survives. It is NOT a declared containerPort, which is why
    # neither a ServiceMonitor `targetPort` nor a PodMonitor `targetPort` can
    # select it — both compile down to a relabel that keeps only DECLARED
    # ports, so they silently yield zero targets.
    #
    # A Service has no such restriction: it will forward to any port number on
    # the pod. Declaring it here gives the ServiceMonitor a named Service port
    # to attach to, which is the one form of discovery that works.
    #
    # NOT named `http-*` on purpose. Istio infers L7 protocol from the port
    # name, and this carries Prometheus exposition format, not application
    # HTTP that should be routed, retried or split by the VirtualService.
    # ------------------------------------------------------------------------
    - name: tcp-metrics
      port: 15020
      targetPort: 15020
      protocol: TCP
