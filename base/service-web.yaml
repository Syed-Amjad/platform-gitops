apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app: web
    app.kubernetes.io/part-of: webapp
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    # The Istio sidecar's merged metrics port — see service-api.yaml for why
    # this exists and why it is not named `http-*`.
    - name: tcp-metrics
      port: 15020
      targetPort: 15020
      protocol: TCP
