# Minimal Zabbix for the host tier. See README.md in this directory for when
# this is actually warranted — on a shared 8 GB lab node, it usually is not.

zabbixServer:
  enabled: true
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

zabbixWeb:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }

# The agent is the part that actually earns its place: a DaemonSet collecting
# host-level metrics that Prometheus's node-exporter covers differently, plus
# the ability to poll external SNMP devices that live outside the cluster.
zabbixAgent:
  enabled: true
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }

postgresql:
  enabled: true
  primary:
    persistence:
      size: 8Gi
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }

zabbixProxy:
  enabled: false
