apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: webapp-dev

resources:
  - namespace.yaml
  - ../../base

helmGlobals:
  chartHome: ../../charts

# Dev runs one version only. There is no canary to split, so no v2 release and
# no DestinationRule subsets — which is exactly the kind of difference overlays
# exist to express.
helmCharts:
  - name: microservice
    releaseName: api-v1
    namespace: webapp-dev
    valuesFile: values-api-v1.yaml

  - name: microservice
    releaseName: web
    namespace: webapp-dev
    valuesFile: values-web.yaml

labels:
  - includeSelectors: false
    pairs:
      environment: dev
