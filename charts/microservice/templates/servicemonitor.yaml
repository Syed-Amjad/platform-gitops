{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.name }}-{{ .Values.version }}
  labels:
    # kube-prometheus-stack only adopts ServiceMonitors carrying its release
    # label — UNLESS serviceMonitorSelectorNilUsesHelmValues is false, which
    # observability/prometheus-values.yaml sets. Both are here so this works
    # either way.
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: webapp
spec:
  selector:
    matchLabels:
      app: {{ .Values.name }}
  endpoints:
    # ------------------------------------------------------------------------
    # Scrapes the ISTIO SIDECAR's merged endpoint, not the app port.
    #
    # This used to be `port: http` (:8000) with path /metrics, which is the
    # obvious thing and fails: STRICT mTLS in this namespace makes the sidecar
    # reset any plain-HTTP connection, so every target sat permanently DOWN
    # with "connection reset by peer" while the app served /metrics perfectly
    # well from inside the pod.
    #
    # Port 15020 is the sidecar's telemetry port. Istio exempts it from mTLS
    # precisely so monitoring survives, and with the prometheus.io/* pod
    # annotations set (see deployment.yaml) what it serves is the application's
    # own metrics merged with Envoy's.
    #
    # Net effect: STRICT mTLS is kept, http_requests_total is scraped, AND
    # istio_requests_total comes along for free.
    #
    # targetPort rather than port: 15020 belongs to the pod, not the Service —
    # the Service deliberately exposes only :8000.
    # ------------------------------------------------------------------------
    - targetPort: 15020
      path: /stats/prometheus
      interval: {{ .Values.serviceMonitor.interval }}
      # Without this, every scraped series is labelled with the POD ip and the
      # `version` label never reaches Prometheus — so you cannot break the SLO
      # down per canary version, which is the entire point of scraping it.
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_version]
          targetLabel: version
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
{{- end }}
