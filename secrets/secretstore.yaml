# Where External Secrets goes to fetch values.
#
# API VERSION NOTE — changed, and the reason is worth keeping.
#
# This file originally declared `v1beta1`, correct for External Secrets Operator
# 0.9.x–0.13.x. It is now `v1`, because ESO has moved on: the chart installed by
# scripts/install-platform-deps.sh is 2.11.0, and its CRDs serve **only v1**.
# v1beta1 is not merely deprecated there — it is gone.
#
# Left unchanged, wave 0 fails with "no matches for kind ClusterSecretStore",
# which reads like a typo in this file and is not. Verify against the install
# rather than trusting any comment, including this one:
#
#   kubectl api-resources --api-group=external-secrets.io
#
# The field names are identical between the two versions, so this was an
# apiVersion bump and nothing more.

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret" # KV v2 mount
      version: "v2"
      auth:
        # Kubernetes auth, not a static token. The operator proves its identity
        # with its ServiceAccount token, and Vault decides what that identity
        # may read. No credential is stored anywhere for an attacker to lift.
        kubernetes:
          mountPath: "kubernetes"
          role: "webapp"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
