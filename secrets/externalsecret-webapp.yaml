# Git contains the REFERENCE. Never the value.
#
# The Kubernetes Secret named below does not exist in this repository and never
# will. External Secrets creates it at runtime from Vault and refreshes it every
# hour — so rotating the credential in Vault propagates to the cluster with no
# commit, no pipeline run, and no redeployment.
#
# That is demonstration 6 in docs/DEMO-RESULTS.md, and it is the one that
# actually proves the pattern rather than describing it.

# apiVersion is v1, not v1beta1 — see secrets/secretstore.yaml for why.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: webapp-db
  namespace: webapp-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: webapp-db # the Secret that gets created
    creationPolicy: Owner # deleting this ExternalSecret deletes the Secret
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: webapp/database
        property: password
    - secretKey: DB_USER
      remoteRef:
        key: webapp/database
        property: username
