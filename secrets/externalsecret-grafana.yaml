# Grafana's admin credentials, from Vault.
#
# observability/prometheus-values.yaml references this Secret by name via
# `grafana.admin.existingSecret`. The alternative — putting adminPassword in the
# values file — would commit a password to git, which is exactly the thing this
# whole layer exists to avoid.
#
# Created in wave 0 so the chart in wave 1 finds it already present.

# apiVersion is v1, not v1beta1 — see secrets/secretstore.yaml for why.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: grafana/admin
        property: username
    - secretKey: admin-password
      remoteRef:
        key: grafana/admin
        property: password
