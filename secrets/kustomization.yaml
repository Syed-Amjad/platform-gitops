apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Namespaces first — the ExternalSecrets below target them, and wave 0 runs
  # before the charts that would otherwise create them.
  - namespace-observability.yaml
  - namespace-logging.yaml
  - secretstore.yaml
  - externalsecret-webapp.yaml
  - externalsecret-grafana.yaml
