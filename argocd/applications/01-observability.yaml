# Wave 1 — metrics stack.
#
# Deployed from the upstream chart with our values, rather than vendored into
# this repo. The values file IS the configuration under version control; the
# chart is a dependency, pinned by version.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 65.1.1 # pinned — an unpinned chart is an unreproducible cluster
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/observability/prometheus-values.yaml
    - repoURL: https://github.com/Syed-Amjad/platform-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The kube-prometheus-stack CRDs exceed the 262144-byte annotation limit
      # that client-side apply uses to store last-applied-configuration.
      # Without ServerSideApply the sync fails with "metadata.annotations: Too
      # long" — the single most common first failure with this chart.
      - ServerSideApply=true
  ignoreDifferences:
    # The chart's admission webhook rewrites its own caBundle after creation.
    # Without this ArgoCD reports the app permanently OutOfSync against a field
    # it does not own.
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
