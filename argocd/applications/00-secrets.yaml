# Wave 0 — secrets first.
#
# Sync waves are the detail that makes the difference between a platform that
# comes up and one that crash-loops on a fresh cluster. Without them ArgoCD
# applies everything at once, the application starts before the Secret that
# External Secrets is still creating exists, and you spend an hour debugging
# what looks like an application bug.
#
# ArgoCD completes every resource in a wave and waits for it to report Healthy
# before starting the next.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://github.com/Syed-Amjad/platform-gitops.git
    targetRevision: main
    path: secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: webapp-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
