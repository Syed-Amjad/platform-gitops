apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform workloads — restricted scope

  # ---------------------------------------------------------------------------
  # An AppProject is what makes GitOps AUDITABLE rather than merely automated.
  # It constrains which repository may deploy which kinds of resource into which
  # namespaces. Without one, anyone with write access to any connected repo can
  # create a ClusterRoleBinding and own the cluster.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # An ALLOWLIST, and still an allowlist after this fix — three named entries,
  # not `'*'`.
  #
  # This originally listed only the GitOps repo, with the comment "this repo,
  # and only this repo". That read well and was wrong: three of the
  # Applications are multi-source and pull their charts from upstream Helm
  # repositories. ArgoCD refused them with
  #
  #   application repo https://prometheus-community.github.io/helm-charts
  #   is not permitted in project 'platform'
  #
  # and the damage was not limited to those three. Without kube-prometheus-stack
  # there is no monitoring.coreos.com/v1, so `observability-config` and `webapp`
  # then failed with "failed to discover server resources for group version" —
  # one allowlist entry short, four Applications broken, and only one of the
  # four error messages naming the real cause.
  #
  # The correct fix is to name the upstreams you actually depend on. Widening
  # this to '*' would delete the control: the point of sourceRepos is that a
  # commit cannot introduce a new source without someone changing THIS file.
  # ---------------------------------------------------------------------------
  sourceRepos:
    - https://github.com/Syed-Amjad/platform-gitops.git # the declared state
    - https://prometheus-community.github.io/helm-charts # kube-prometheus-stack
    - https://grafana.github.io/helm-charts # loki, promtail

  destinations:
    - namespace: "webapp-*"
      server: https://kubernetes.default.svc
    - namespace: observability
      server: https://kubernetes.default.svc
    - namespace: logging
      server: https://kubernetes.default.svc
    # Required by the root app-of-apps: the child Application objects it creates
    # live here. Omit this and the root Application is refused with
    # "application destination is not permitted in project" — a confusing first
    # failure, because the error names the project, not the namespace.
    - namespace: argocd
      server: https://kubernetes.default.svc
    # kube-prometheus-stack puts kube-state-metrics and the node-exporter
    # DaemonSet here. Not optional, and not obvious from the chart's name.
    - namespace: kube-system
      server: https://kubernetes.default.svc

  # ---------------------------------------------------------------------------
  # An honest note, because this list got longer than its author intended.
  #
  # The original project allowed exactly two cluster-scoped kinds, and denied
  # ClusterRole/ClusterRoleBinding outright, on the reasoning that privilege
  # escalation through a committed manifest is THE GitOps-specific attack.
  # That reasoning is right. It is also incompatible with installing
  # kube-prometheus-stack, which ships its own CRDs, its operator's RBAC, and
  # admission webhooks — and legitimately needs all of them.
  #
  # So this is a real trade-off, not an oversight being papered over:
  # a platform that installs a monitoring operator IS a platform that can
  # create cluster RBAC. Pretending otherwise would mean either not deploying
  # the stack, or deploying it outside GitOps where nothing reviews it.
  #
  # What still constrains this project after the widening:
  #   * sourceRepos  — three named repositories, not '*'
  #   * destinations — five named namespaces, not '*'
  #   * the list below is an allowlist of KINDS, so a manifest introducing,
  #     say, a ValidatingAdmissionPolicy is still refused
  #
  # What no longer constrains it: it can create ClusterRoles. Worth saying out
  # loud in the write-up rather than leaving the original comment in place and
  # implying a control that is not there.
  # ---------------------------------------------------------------------------
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    # ClusterSecretStore is CLUSTER-scoped. Without it here, secrets/ fails to
    # sync even though its namespace is permitted above — namespace permission
    # and cluster-resource permission are two separate gates.
    - group: "external-secrets.io"
      kind: ClusterSecretStore
    # Everything below is kube-prometheus-stack. Without these, wave 1 cannot
    # install; without wave 1 there is no monitoring.coreos.com/v1; and waves 2
    # and 3 then fail with "failed to discover server resources", which names
    # neither this file nor the real problem.
    - group: "apiextensions.k8s.io"
      kind: CustomResourceDefinition
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
    - group: "admissionregistration.k8s.io"
      kind: MutatingWebhookConfiguration
    - group: "admissionregistration.k8s.io"
      kind: ValidatingWebhookConfiguration

  # NOTE: ClusterRole and ClusterRoleBinding used to be listed here. That was
  # doubly wrong — they are cluster-scoped, so `namespaceResourceBlacklist` was
  # never the field that governed them (clusterResourceWhitelist above is), and
  # the chart needs them regardless. Left empty rather than deleted, as the
  # place to put a genuinely namespaced kind you want to forbid.
  namespaceResourceBlacklist: []

  roles:
    - name: read-only
      description: View applications without the ability to sync or delete
      policies:
        - p, proj:platform:read-only, applications, get, platform/*, allow
